[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "distiller-cm5-python"
version = "0.1.0"
description = "python exe of distiller python client"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "aiohttp",
  "colorama",
  "evdev",
  "fastapi>=0.104",
  "faster-whisper",
  "fastmcp==2.10.4",
  "lgpio==0.2.2",
  "llama-cpp-python>=0.3.2",
  "mcp",
  "nest-asyncio",
  "numba",
  "opencv-python>=4.8",
  "pillow>=10",
  "psutil>=5.9",
  "pyaudio",
  "pydantic>=2.4.2",
  "pyqt6<6.8",
  "pyserial>=3.5",
  "qasync",
  "requests>=2.31",
  "sherpa-onnx",
  "sounddevice",
  "soundfile",
  "spidev>=3.6",
  "typing-extensions>=4.8",
  "uvicorn>=0.24",
]
author = [
  { name = "PamirAI Incorporated", email = "founders@pamir.ai" },
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.uv]
required-environments = [ "platform_machine == 'aarch64'" ]
index-url = "https://pypi.org/simple"
extra-index-url = [
  "https://abetlen.github.io/llama-cpp-python/whl/cpu",
]
