# Battery configuration parameters for Pamir AI devices
# Modify these values to customize battery behavior according to your requirements

[battery.thresholds]
# Battery percentage thresholds
critical = 2    # 2% - trigger shutdown
low = 15        # 15% - show warning  
warning = 25    # 25% - show low battery notice

# Temperature thresholds
temperature_warning = 55.0  # 55°C - show temperature warning

# Current detection thresholds (in amperes)
charging_current = 0.01     # 0.01A - minimum current to consider charging

[battery.monitoring]
# Battery monitoring intervals (in milliseconds)
update_interval = 5000      # 5 seconds - battery indicator update
monitor_interval = 10000    # 10 seconds - main battery monitoring

[battery.hardware]
# Hardware configuration
sysfs_path = "/sys/class/power_supply/pamir_battery"

[battery.status_patterns]
# Status indication patterns for 1-bit monochrome display
critical = "solid_black"     # Solid black fill - critical
low = "diagonal_stripes"     # Diagonal stripes - low
warning = "cross_hatch"      # Cross-hatch pattern - warning
good = "solid_fill"          # Normal solid fill - good
unknown = "empty"            # Empty - unknown status

[battery.status_text]
# Text indicators for battery status (1-bit display compatible)
critical = "CRIT"           # Critical battery text
low = "LOW"                 # Low battery text
warning = "WARN"            # Warning battery text
good = "OK"                 # Good battery text
unknown = "UNK"             # Unknown battery text

[battery.icons.charging]
# Icon names for charging states
full = "battery-charging-full"
high = "battery-charging-high"
medium = "battery-charging-medium"
low = "battery-charging-low"
unknown = "battery-charging-unknown"

[battery.icons.discharging]
# Icon names for discharging states
full = "battery-full"
good = "battery-good"
medium = "battery-medium"
low = "battery-low"
critical = "battery-critical"
unknown = "battery-unknown"
